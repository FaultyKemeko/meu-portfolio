</head>
<body>

  <canvas id="sky" aria-hidden="true"></canvas>

  <main class="container">
    <div class="profile-pic-container">
      <img src="assets/unnamed.jpg" alt="Foto de Perfil" class="profile-pic">

    <div class="links-container">
        <a href="sobre.html" class="btn">Sobre mim</a>

    <div class="social-links">
      <a href="https://github.com/FaultyKemeko" target="_blank" aria-label="GitHub">

        <i class="fa-solid fa-gamepad"></i>
      </a>
    </div>
  </main>

  <script>
  (function(){
    const canvas = document.getElementById('sky');
    const ctx = canvas.getContext('2d');
    let W, H, stars = [];
    const numStars = 65;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function initStars() {
      stars = [];
      for (let i = 0; i < numStars; i++) {
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          length: Math.random() * 90 + 30,
          speed: Math.random() * 5 + 3,
          opacity: Math.random() * 0.7 + 0.3
        });
      }
    }

    function animate() {
      ctx.clearRect(0, 0, W, H);
      ctx.lineWidth = 2;
      for (let i = 0; i < stars.length; i++) {
        let s = stars[i];
        let gradient = ctx.createLinearGradient(s.x, s.y, s.x - s.length * 0.7, s.y - s.length * 0.7);
        gradient.addColorStop(0, `rgba(210, 230, 255, ${s.opacity})`);
        gradient.addColorStop(1, 'rgba(210, 230, 255, 0)');
        ctx.strokeStyle = gradient;
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x - s.length * 0.7, s.y - s.length * 0.7);
        ctx.stroke();

        s.x -= s.speed * 0.7;
        s.y += s.speed;

        if (s.y > H + 50 || s.x < -50) {
          s.x = Math.random() * (W + 200);
          s.y = -50;
        }
      }
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => { resize(); initStars(); });
    resize(); initStars(); animate();
  })();
  </script>
</body>
</html>
